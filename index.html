<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Orange Ember Studios" />
    <meta name="publisher" content="Orange Ember Studios" />
    <title>Orange Ember Studios</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#18191f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Cloudflare Turnstile script -->
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
      async
      defer
      onload="window.turnstileLoaded = true"
      onerror="console.error('Failed to load Turnstile script')"
    ></script>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://cdn.jsdelivr.net; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com https://cloudflareinsights.com https://api.resend.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; worker-src 'self' blob:;"
    />
  </head>
  <style>
    @keyframes oe-spin { to { transform: rotate(360deg); } }
    #oe-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f19;
      z-index: 9999;
      transition: opacity 0.2s ease;
    }
    #oe-loader.fade-out { opacity: 0; pointer-events: none; }
    #oe-loader-ring {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(249,115,22,0.2);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: oe-spin 0.7s linear infinite;
    }
  </style>
  <body
    class="bg-[#0b0f19] text-[#f3f4f6] font-['Outfit',sans-serif] antialiased selection:bg-orange-500/30 selection:text-orange-200"
  >
    <div id="oe-loader"><div id="oe-loader-ring"></div></div>
    <div id="app"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
